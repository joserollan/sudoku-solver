name: Deploy to Oracle VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 161.153.202.119
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            # System programs the app needs (shared by prod and staging)
            command -v tesseract >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr)
            cd ~/sudoku-solver
            git pull origin main
            venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart sudoku
