name: Deploy to Staging

on:
  # Pushing any commit to the `staging` branch deploys it, e.g.
  #   git push -f origin my-feature-branch:staging
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to stage (leave empty to use the one picked above)"
        required: false
        default: ""

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        with:
          host: 161.153.202.119
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BRANCH
          script: |
            set -euo pipefail
            git check-ref-format --branch "$BRANCH" >/dev/null
            # System programs the app needs (shared by prod and staging)
            command -v tesseract >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr)
            cd ~/sudoku-staging
            git fetch --prune origin
            git checkout -f -B staging "origin/$BRANCH"
            git clean -fd
            venv/bin/pip install -q -r requirements.txt
            # Imports and programs that only load when someone uses the app:
            # the server's health check below can't see these failing.
            venv/bin/python -c "import cv2, numpy, PIL, pytesseract, sudoku_vision"
            tesseract --list-langs 2>/dev/null | grep -qx eng
            sudo systemctl restart sudoku-staging
            # Wait up to 30 s for the server to answer, then make sure it
            # stays up (a crash-looping service can answer once and die).
            for _ in $(seq 30); do
              curl -fsS --max-time 2 http://127.0.0.1:8502/_stcore/health >/dev/null 2>&1 && break
              sleep 1
            done
            sleep 3
            if ! systemctl is-active -q sudoku-staging ||
               ! curl -fsS --max-time 2 http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo "Staging failed its health check; recent logs:"
              sudo journalctl -u sudoku-staging -n 40 --no-pager
              exit 1
            fi
            echo "Staging now serves $BRANCH @ $(git rev-parse --short HEAD) (healthy)"
