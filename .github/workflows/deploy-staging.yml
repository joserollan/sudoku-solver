name: Deploy to Staging

# Manual only: Actions tab -> "Deploy to Staging" -> Run workflow.
# Pick the branch in "Use workflow from", or type one in the input below.
# There is a single staging slot: each run replaces whatever was there.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to stage (leave empty to use the one picked above)"
        required: false
        default: ""

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        with:
          host: 161.153.202.119
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BRANCH
          script: |
            set -euo pipefail
            git check-ref-format --branch "$BRANCH" >/dev/null
            cd ~/sudoku-staging
            git fetch --prune origin
            git checkout -f -B staging "origin/$BRANCH"
            git clean -fd
            venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart sudoku-staging
            echo "Staging now serves $BRANCH @ $(git rev-parse --short HEAD)"
